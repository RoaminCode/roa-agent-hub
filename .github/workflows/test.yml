# Runs the tests on every push and pull request. Everything runs on fakes: no keys, no AI
# spend, no HubSpot or LightSpeed calls.
name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node -e "require('./src/server')"
      - run: npm test
